# Publishes the site to Cloudflare on every change to main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Run it by hand from the Actions tab with "Reload card and Pokémon data" ticked
# the first time, and again whenever a new card set comes out.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_data:
        description: "Reload card and Pokémon data"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Publish the site (creates the database on the first run)
        run: npx wrangler deploy
      - name: Update the database tables
        run: npx wrangler d1 migrations apply trainer-hub --remote
      - name: Load card and Pokémon data
        if: ${{ inputs.load_data }}
        run: npm run data:build && node scripts/load-seed.mjs --remote
